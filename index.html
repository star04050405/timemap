<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:#FBFBF9;color:#17171A;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  min-height:100vh;overflow-x:hidden;
}
/* ---------- 地图页 ---------- */
#map{max-width:640px;margin:0 auto;padding:clamp(28px,7vw,56px) 20px 60px}
.mast{text-align:center;margin-bottom:8px}
.mast .eyebrow{font-size:11px;letter-spacing:.35em;color:#9a9a95;font-weight:600}
.mast h1{
  font-size:clamp(34px,9.5vw,52px);font-weight:900;letter-spacing:.02em;
  margin-top:10px;line-height:1.15;
}
.mast .sub{margin-top:12px;font-size:13px;color:#8b8b86;letter-spacing:.12em}
.mast .sub b{color:#17171A;font-weight:700}
.pin{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px;vertical-align:1px}
/* 楼 */
.bld{
  display:block;border:0;background:none;width:100%;cursor:pointer;
  padding:0;opacity:0;transform:translateY(26px);
  transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);
  will-change:transform;
}
.bld.in{opacity:1;transform:translateY(0)}
.bld:active{transform:scale(.975)}
.bld img{width:100%;height:auto;display:block;pointer-events:none}
#blocks{margin-top:40px}
.row{margin:clamp(6px,2vw,18px) 0}
.row.r1{width:78%;margin-right:auto}
.row.r2{width:78%;margin-left:auto;margin-top:-2%}
.row.r3{width:78%;margin:clamp(-4px,-1vw,0px) auto}
.row.r4{width:78%;margin-right:auto;margin-top:-3%}
.row.r5{width:78%;margin-left:auto;margin-top:-2%}
.hint{
  text-align:center;margin-top:34px;font-size:12px;color:#b3b3ad;letter-spacing:.25em;
}
/* 底注 */
.foot{
  text-align:center;padding:44px 0 56px;color:#b9b9b3;font-size:12px;letter-spacing:.18em;line-height:2.1;
}
.foot .big{font-size:15px;color:#17171A;font-weight:800;letter-spacing:.28em}
/* ---------- 分类页 ---------- */
#cat{position:fixed;inset:0;background:#FBFBF9;z-index:10;overflow-y:auto;
  -webkit-overflow-scrolling:touch;display:none}
#cat.open{display:block;animation:catin .38s cubic-bezier(.2,.7,.2,1)}
@keyframes catin{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.catwrap{max-width:640px;margin:0 auto;padding:0 20px 70px}
.catbar{position:sticky;top:0;background:rgba(251,251,249,.92);backdrop-filter:blur(10px);z-index:5;
  padding:14px 0 12px;border-bottom:1.5px solid #17171A;display:flex;align-items:center;gap:12px}
.back{
  border:1.5px solid #17171A;background:#fff;border-radius:999px;width:38px;height:38px;
  font-size:17px;line-height:1;cursor:pointer;flex:none;color:#17171A;
  transition:transform .15s;
}
.back:active{transform:scale(.92)}
.catbar .cb-t{font-weight:900;font-size:18px;letter-spacing:.06em}
.catbar .cb-n{margin-left:auto;font-size:12px;color:#9a9a95;letter-spacing:.15em;white-space:nowrap}
.cather{padding:30px 2px 6px}
.cather .c-no{font-family:Georgia,serif;font-style:italic;font-size:15px;color:var(--c);letter-spacing:.2em}
.cather h2{font-size:clamp(28px,7.5vw,38px);font-weight:900;margin-top:6px}
.cather .c-quote{margin-top:10px;font-size:14px;color:#7c7c76;line-height:1.8;max-width:30em}
.cather .c-line{margin-top:18px;height:10px;width:64px;border-radius:99px;background:var(--c)}
.gtitle{
  margin:34px 0 4px;display:flex;align-items:baseline;gap:10px;
  font-size:13px;font-weight:800;letter-spacing:.3em;color:#17171A;
}
.gtitle::after{content:"";flex:1;height:1px;background:#e2e2dc}
.gtitle .gn{font-size:11px;color:#b3b3ad;letter-spacing:.1em;font-weight:600}
.st{
  display:flex;align-items:center;gap:14px;padding:15px 2px;
  border-bottom:1px solid #ecece6;text-decoration:none;color:inherit;
  opacity:0;transform:translateY(14px);animation:stin .5s cubic-bezier(.2,.7,.2,1) forwards;
}
@keyframes stin{to{opacity:1;transform:none}}
.st:active{background:#f3f3ee}
.st .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;opacity:.9}
.st .tx{flex:1;min-width:0}
.st .nm{display:block;font-size:15.5px;font-weight:700;letter-spacing:.02em}
.st .ds{display:block;font-size:12.5px;color:#8f8f89;margin-top:3px;line-height:1.5}
.st .go{flex:none;text-align:right}
.st .go .dm{font-size:10.5px;color:#b8b8b2;letter-spacing:.04em;font-family:ui-monospace,Menlo,monospace}
.st .go .ar{display:block;text-align:right;font-size:15px;color:var(--c);margin-top:2px}

/* ---------- 搜索 ---------- */
.sbar{display:flex;align-items:center;gap:10px;margin:26px auto 0;max-width:480px;
  background:#fff;border:1.5px solid #17171A;border-radius:999px;padding:0 16px;height:48px;
  transition:box-shadow .2s}
.sbar:focus-within{box-shadow:0 4px 0 rgba(23,23,26,.9)}
.sbar .sicon{flex:none;font-size:15px;color:#17171A;opacity:.55}
.sbar input{flex:1;min-width:0;border:0;outline:none;background:transparent;
  font-size:16px;font-family:inherit;color:#17171A;letter-spacing:.02em}
.sbar input::placeholder{color:#b9b9b3;letter-spacing:.1em}
.sclear{flex:none;border:0;background:#efefe9;color:#17171A;width:26px;height:26px;border-radius:50%;
  font-size:12px;cursor:pointer;display:none;line-height:1}
.sclear.show{display:block}
.sbar input[type=search]::-webkit-search-cancel-button,.sbar input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
#sres{display:none}
#sres.show{display:block}
#sres .scount{margin:30px 2px 4px;font-size:12px;color:#8b8b86;letter-spacing:.18em}
#sres .scount b{color:#17171A}
.sr{display:flex;align-items:center;gap:14px;padding:15px 2px;border-bottom:1px solid #ecece6;
  text-decoration:none;color:inherit}
.sr:active{background:#f3f3ee}
.sr .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sr .tx{flex:1;min-width:0}
.sr .fl{display:block;font-size:10.5px;letter-spacing:.2em;margin-bottom:3px;font-weight:700}
.sr .nm{display:block;font-size:15.5px;font-weight:700;letter-spacing:.02em}
.sr .nm mark{background:rgba(23,23,26,.12);color:inherit;border-radius:3px;padding:0 1px}
.sr .ds{display:block;font-size:12.5px;color:#8f8f89;margin-top:3px;line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .go{flex:none;text-align:right}
.sr .go .ar{font-size:15px;color:#9a9a95}
.sr .go .ar{color:var(--c,#17171A)}
.snone{text-align:center;padding:46px 0 10px;color:#b3b3ad;font-size:13px;letter-spacing:.15em;line-height:2.2}
.snone b{color:#17171A;font-size:15px;letter-spacing:.05em;display:block}
.catfoot{margin-top:44px;text-align:center;color:#c2c2bc;font-size:11.5px;letter-spacing:.22em}
</style>

// ---------- engine ----------
const $=s=>document.querySelector(s);
const TOT = MAP.reduce((a,c)=>a+c.groups.reduce((x,g)=>x+g.items.length,0),0);
$('#tot').textContent=TOT;
$('#ftn').textContent=TOT+' SITES';
$('#pins').innerHTML=MAP.map(m=>'<span class="pin" style="background:'+m.color+'"></span>').join('');

const rows=['r1','r2','r3','r4','r5'];
$('#blocks').innerHTML=MAP.map((m,i)=>
  '<div class="row '+rows[i]+'"><button class="bld" data-id="'+m.id+'" aria-label="'+m.name+'">'+
    '<img src="'+m.img+'" alt="'+m.name+'" loading="lazy"></button></div>').join('');

const blds=[...document.querySelectorAll('.bld')];
const io=new IntersectionObserver(es=>es.forEach((e,idx)=>{
  if(e.isIntersecting){setTimeout(()=>e.target.classList.add('in'), idx*90);io.unobserve(e.target);}
}),{threshold:.1});
blds.forEach(b=>io.observe(b));

function host(u){try{return new URL(u).hostname.replace('.github.io','').replace('.netlify.app','')}catch(e){return ''}}

let cur=null, opening=false;
function openCat(id){
  const m=MAP.find(x=>x.id===id); if(!m)return;
  cur=id;
  $('#cbT').textContent=m.name;
  const total=m.groups.reduce((a,g)=>a+g.items.length,0);
  $('#cbN').textContent=total+' sites';
  let k=0;
  $('#catBody').innerHTML=
   '<div class="cather" style="--c:'+m.color+'">'+
     '<div class="c-no">'+m.no+'</div>'+
     '<h2>'+m.name+'</h2>'+
     '<div class="c-quote">'+m.quote+'</div>'+
     '<div class="c-line"></div>'+
   '</div>'+
   m.groups.map(g=>
     '<div class="gtitle">'+g.g+'<span class="gn">'+g.items.length+'</span></div>'+
     g.items.map(it=>{k++;return (
     '<a class="st" style="--c:'+m.color+';animation-delay:'+Math.min(k*35,600)+'ms" href="'+it.u+'" target="_blank" rel="noopener">'+
       '<span class="dot"></span>'+
       '<span class="tx"><span class="nm">'+it.n+'</span><span class="ds">'+it.d+'</span></span>'+
       '<span class="go"><span class="dm">'+host(it.u)+'</span><span class="ar">&#8599;</span></span>'+
     '</a>')}).join('')
   ).join('')+'<div class="catfoot">'+m.name+' · '+total+' sites</div>';
  $('#cat').classList.add('open');
  $('#cat').scrollTop=0;
  opening=true; location.hash=id; setTimeout(()=>opening=false,0);
}
function closeCat(){
  cur=null; $('#cat').classList.remove('open');
  if(location.hash){opening=true; history.pushState('',document.title,location.pathname); setTimeout(()=>opening=false,0);}
}
document.querySelectorAll('.bld').forEach(b=>b.addEventListener('click',()=>openCat(b.dataset.id)));
$('#bk').addEventListener('click',closeCat);
window.addEventListener('hashchange',()=>{
  if(opening)return;
  const id=location.hash.slice(1);
  if(MAP.some(m=>m.id===id)&&cur!==id)openCat(id);
  else if(!location.hash)closeCat();
});

// ---------- 搜索 ----------
const sinput=document.getElementById('sinput'), sclear=document.getElementById('sclear'), sres=document.getElementById('sres');
let stimer=null;
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hi(text,q){
  const i=text.toLowerCase().indexOf(q);
  if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function doSearch(){
  const q=sinput.value.trim().toLowerCase();
  sclear.classList.toggle('show', !!q);
  if(!q){
    sres.classList.remove('show'); sres.innerHTML='';
    document.getElementById('blocks').style.display='';
    document.querySelector('.hint').style.display='';
    return;
  }
  const hits=[];
  MAP.forEach(m=>m.groups.forEach(g=>g.items.forEach(it=>{
    if((it.n+' '+it.d+' '+g.g+' '+m.name).toLowerCase().includes(q))
      hits.push({m,g,it});
  })));
  document.getElementById('blocks').style.display='none';
  document.querySelector('.hint').style.display='none';
  if(!hits.length){
    sres.innerHTML='<div class="snone"><b>没有找到「'+esc(sinput.value.trim())+'」</b>试试：钢琴 · 帕梅拉 · 庄子 · 追剧 · 手账 · 冥想</div>';
  } else {
    const floors=[...new Set(hits.map(x=>x.m.name))].join(' · ');
    sres.innerHTML=
      '<div class="scount">找到 <b>'+hits.length+'</b> 个 · '+esc(floors)+'</div>'+
      hits.map(x=>
        '<a class="sr" style="--c:'+x.m.color+'" href="'+x.it.u+'" target="_blank" rel="noopener">'+
        '<span class="dot" style="background:'+x.m.color+'"></span>'+
        '<span class="tx"><span class="fl" style="color:'+x.m.color+'">'+esc(x.m.name)+' · '+esc(x.g.g)+'</span>'+
        '<span class="nm">'+hi(x.it.n,q)+'</span><span class="ds">'+esc(x.it.d)+'</span></span>'+
        '<span class="go"><span class="ar">&#8599;</span></span></a>').join('');
  }
  sres.classList.add('show');
}
sinput.addEventListener('input',()=>{clearTimeout(stimer);stimer=setTimeout(doSearch,110)});
sclear.addEventListener('click',()=>{sinput.value='';doSearch();sinput.focus()});
sinput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sinput.blur();}});
if(location.hash){const id=location.hash.slice(1);if(MAP.some(m=>m.id===id))setTimeout(()=>openCat(id),120);}

</script>
